name: Publish catalog

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        run: |
          DATETIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # vYYYY.MM.DD.HHMMSS.manual.<run> — published (not draft) for launchers
            TAG="v$(date -u +%Y.%m.%d.%H%M%S).manual.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "datetime=$DATETIME" >> "$GITHUB_OUTPUT"
          echo "Using release tag $TAG ($DATETIME)"

      - name: Stamp index.json
        run: |
          # Manual runs pass wall-clock UTC; tag pushes derive date/time from the tag.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 .github/scripts/stamp_catalog_release.py \
              --tag "${{ steps.meta.outputs.tag }}" \
              --datetime "${{ steps.meta.outputs.datetime }}"
          else
            python3 .github/scripts/stamp_catalog_release.py \
              --tag "${{ steps.meta.outputs.tag }}"
          fi

      - name: Validate JSON
        run: |
          python3 -c "import json; json.load(open('index.json'))"
          shopt -s nullglob
          for f in titles/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok $f"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          idx = json.load(open("index.json"))
          ids = idx.get("titles", [])
          missing = [i for i in ids if not Path(f"titles/{i}.json").is_file()]
          extras = sorted({p.stem for p in Path("titles").glob("*.json")} - set(ids))
          if missing:
              raise SystemExit(f"index lists missing files: {missing}")
          if extras:
              print(f"warning: titles not in index: {extras}")
          print(f"{len(ids)} titles ok; catalog_date={idx.get('catalog_date')} release_tag={idx.get('release_tag')}")
          PY

      - name: Pack catalog.zip
        run: |
          rm -f catalog.zip
          zip -qr catalog.zip index.json titles SCHEMA.md README.md
          ls -lah catalog.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-zip
          path: catalog.zip

      - name: GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: catalog.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dated release (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Catalog ${{ steps.meta.outputs.tag }}
          files: catalog.zip
          draft: false
          generate_release_notes: true
          body: |
            Manual catalog publish (${{ steps.meta.outputs.datetime }} UTC).
            Stamped `catalog_date` / `release_tag` in `index.json`.
            Launchers fetch: `…/releases/latest/download/catalog.zip`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
